name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No npm install: the project has zero dependencies.
      - name: Run tests
        run: node --test tests
      - name: Regenerate artifacts (must stay deterministic)
        run: |
          node tools/generate-artifacts.cjs
          git diff --exit-code -- examples results
